[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-mcp"
version = "0.1.0"
description = "AIXplore Podcast Generator — MCP server for creating engaging podcast audio from content using Gemini AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
podcast-mcp = "podcast_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_mcp"]
